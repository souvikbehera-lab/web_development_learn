<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator </title>
    <link rel="stylesheet" href="calcu.css">
</head>
<body>
    <div class="container">
        <button class="box1" id="display">0</button>
        <button class="box " onclick="press('7')">7</button>
        <button class="box " onclick="press('8')" >8</button>
        <button class="box "  onclick="press('9')">9</button>
        <button class="box oper " onclick="press('/')">/</button>
        <button class="box " onclick="press('4')">4</button>
        <button class="box " onclick="press('5')">5</button>
        <button class="box " onclick="press('6')">6</button>
        <button class="box oper " onclick="press('*')">*</button>
        <button class="box " onclick="press('1')">1</button>
        <button class="box " onclick="press('2')">2</button>
        <button class="box " onclick="press('3')">3</button>
        <button class="box oper " onclick="press('-')">-</button>
        <button class="box " onclick="press('0')">0</button>
        <button class="box oper " onclick="clearDis()">c</button>
        <button class="box oper " onclick="cal()">=</button>
        <button class="box oper " onclick="press('+')">+</button>
        
    </div>
    <script>
       let display = document.getElementById("display");
    function press(value){
        if (display.textContent==="0"){
            display.textContent=value;
        }
        else{
            display.textContent += value;
        }
    }
    function clearDis(){
        display.textContent = "0";
    }
    function cal(){
        display.textContent = eval(display.textContent);
    }
</script>
</body>
</html>
